  /prenotazione:
    get:
      tags:
        - prenotazione
      summary: restituisce la prenotazione corrente
      description: prenotazione corrente
      operationId: currentPrenotazione

      parameters:
        - name: idPrenotazione
          in: query
          required: true
          schema:
            type: integer
            format: int32

      responses:
        '200':
          description: succesful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrenotazioneDTO'
        '404':
          description: prenotazione corrente non trovata
    post:
      tags:
        - prenotazione
      summary: inserisci prenotazione
      description: inserimento prenotazione
      operationId: creaPrenotazione
      requestBody:
        description: dati da inserire
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioneRequest'
        required: true
      parameters:
        - name: userKey
          in: query
          required: true
          schema:
            type: string

      responses:
        '200':
          description: successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrenotazioneDTO'
        '400':
          description: errore nel form
  /utente:
    get:
      tags:
        - utente
      summary: restituisce l'utente corrente
      description: utente corrente
      operationId: currentUtente
      parameters:
        - name: userKey
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: succesful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UtenteDTO'
        '404':
          description: utente non trovato

  /aggiornaPrenotazione:
    put:
      tags:
        - prenotazione
      summary: Update an existing booking.
      description: Update an existing booking by Id.
      operationId: updatePrenotazione
      requestBody:
        description: dati da modificare
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioneRequest'
        required: true
      parameters:
        - name: idPrenotazione
          in: query
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful
        '404':
          description: errore nei dati
  /aggiornaUtente:
    put:
      tags:
        - utente
      summary: Update an existing user.
      description: Update an existing user by Id.
      operationId: updateUtente
      requestBody:
        description: dati da modificare
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtenteRequest'
        required: true
      parameters:
        - name: userKey
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: successful
        '400':
          description: errore nei dati
  /delete/{id}:
    delete:
      tags:
        - prenotazione
      summary: elimina prenotazione
      description: dato id, elimina prenotazione
      operationId: deletePrenotazione
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      responses:
        '200':
          description: successful
        '404':
          description: prenotazione non trovata
        '400':
          description: form scorretto
#  /deleteUtente/{id}:
