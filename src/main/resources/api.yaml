    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.13
servers:
  - url: http://localhost:8080/dashboard


tags:
  - name: utente
    description: Operations about user management and authentication
  - name: prenotazione
    description: Operations about booking


