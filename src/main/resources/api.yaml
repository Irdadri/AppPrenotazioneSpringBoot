  /:
    get:
      tags:
        - prenotazione
      summary: restituisce la lista delle prenotazioni utente
      description: dato id, restituisce le prenotazioni
      operationId: getDashboard
      parameters:
        - name: userKey
          in: query
          description: id utente
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: pagina
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: size
          required: false
          schema:
            type: integer
            format: int32
            default: 5
      responses:
        '200':
          description: succesful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
                item:
                  $ref: '#/components/schemas/PrenotazioneDTO'
        '404':
          description: prenotazioni non trovate
  /utenti:
    get:
      tags:
        - utente
      summary: restituisce la lista degli utenti
      description: utenti paginati
      operationId: getUtenti
      parameters:
        - name: page
          in: query
          description: pagina
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: size
          required: false
          schema:
            type: integer
            format: int32
            default: 5
      responses:
        '200':
          description: succesful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
                item:
                  $ref: '#/components/schemas/UtenteDTO'
        '404':
          description: utenti non trovati

  /searchPrenotazioniUtente:
    post:
      tags:
        - utente
      summary: restituisce le prenotazioni dell'utente
      operationId: searchPrenotazioniUtente
      parameters:
        - name: userKey
          in: query
          description: uuid utente
          required: true
          schema:
            type: string
        - name: page
          in: query
          description: pagina
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: size
          required: false
          schema:
            type: integer
            format: int32
            default: 5
      requestBody:
        description: dati per la ricerca
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioniFiltro'
      responses:
        '200':
          description: succesful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
                item:
                  $ref: '#/components/schemas/UtenteDTO'
        '404':
          description: prenotazioni utente non trovate
  /searchPrenotazioni:
    post:
      tags:
        - prenotazione
      operationId: searchPrenotazioni
      summary: restituisce tutte le prenotazioni
      parameters:
        - name: page
          in: query
          description: pagina
          required: false
          schema:
            type: integer
            format: int32
            default: 0
        - name: size
          in: query
          description: size
          required: false
          schema:
            type: integer
            format: int32
            default: 5
      requestBody:
        description: dati per la ricerca
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PrenotazioniFiltro'
      responses:
        '200':
          description: succesful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
                item:
                  $ref: '#/components/schemas/PrenotazioneDTO'
        '404':
          description: prenotazioni non trovate
  /signup:
    post:
      tags:
        - utente
      operationId: creaUtente
      summary: nuovo utente
      requestBody:
        description: dati nuovo utente
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UtenteRequest'
      responses:
        '200':
          description: succesful
        '400':
          description: errore nell'inserimento
  /deleteUser:
    delete:
      tags:
        - utente
      operationId: deleteUtente
      parameters:
        - name: userKey
          in: query
          schema:
            type: string
      responses:
        '200':
          description: succesful
        '404':
          description: utente non trovato

components:
  schemas:
    LoginRequest:
      type: object
      properties:
        email:
          type: string
        password:
          type: string

    PrenotazioneDTO:
      type: object
      description: "per lista prenotazione"
      properties:
        id:
          type: integer
          format: int32
        nomeUtente:
          type: string
        cognomeUtente:
          type: string
        citta:
          type: string
        indirizzo:
          type: string
        nStanza:
          type: string
        nPostazione:
          type: integer
          format: int32
        dataInizio:
          type: string
          format: date-time
        dataFine:
          type: string
          format: date-time
        stato:
          type: string

    PrenotazioneRequest:
      type: object
      properties:
        nPostazione:
          type: integer
          format: int32
        dataInizio:
          type: string
          format: date-time

    UtenteDTO:
      type: object
      properties:
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        telefono:
          type: string
        tipoUtente:
          type: string
        paese:
          type: string
        citta:
          type: string
        regione:
          type: string
        indirizzo:
          type: string
        userKey:
          type: string

    UtenteFiltro:
      type: object
      properties:
        email:
          type: string
        citta:
          type: string
        indirizzo:
          type: string

    UtenteRequest:
      type: object
      properties:
        nome:
          type: string
        cognome:
          type: string
        email:
          type: string
        password:
          type: string
        telefono:
          type: string
        tipoUtente:
          type: string
        idSede:
          type: integer
          format: int32

    Page:
      type: object
      properties:
        content:
          type: array
          items:
            oneOf:
              - $ref: '#/components/schemas/PrenotazioneDTO'
              - $ref: '#/components/schemas/UtenteDTO'
        pageNumber:
          type: integer
          format: int32
          example: 0
        pageSize:
          type: integer
          format: int32
          example: 20
        totalElements:
          type: integer
          format: int32
          example: 100
        totalPages:
          type: integer
          format: int32
          example: 5
        last:
          type: boolean
          example: false

    PrenotazioniFiltro:
      type: object
      properties:
        dataInizio:
          type: string
          format: date-time
        dataFine:
          type: string
          format: date-time
        email:
          type: string



