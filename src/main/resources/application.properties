spring.application.name=AppPrenotazioneBoot
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.datasource.url=jdbc:mysql://localhost:3306/prenotazioneappdb?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=rootpassword

userservice.srvUrl=${USER_SERVICE_URL:http://localhost:9090}
userservice.password= password
userservice.user-id= root

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=myGroup


spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.data.redis.connect-timeout=1s